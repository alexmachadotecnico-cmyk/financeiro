<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Finanças</title>
<style>
:root{--bg:#09090b;--card:#121215;--sub:#16161a;--line:rgba(255,255,255,.07);--tx:#f4f4f5;--mut:#a1a1aa;--dim:#71717a;--ok:#10b981;--warn:#f59e0b;--bad:#f43f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.wrap{max-width:460px;margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:20px;margin:0;letter-spacing:-.02em}
.link{background:none;border:0;color:var(--mut);font-size:11px;text-decoration:underline;padding:0;cursor:pointer}
select,input{font:inherit;color:var(--tx);background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
main{max-width:460px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.sub{background:var(--sub);border:1px solid var(--line);border-radius:16px;padding:14px}
.lbl{font-size:12px;color:var(--mut)}.big{font-size:26px;font-weight:700;letter-spacing:-.02em}.mid{font-size:16px;font-weight:700}
.dim{color:var(--dim);font-size:11px}.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px}
.pos{background:rgba(16,185,129,.14);color:#34d399}.neg{background:rgba(244,63,94,.14);color:#fb7185}
.bar{height:8px;background:#27272a;border-radius:99px;overflow:hidden;margin:8px 0 6px}.bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sub);border:1px solid var(--line);border-radius:12px;padding:4px}
nav button{border:0;background:none;color:var(--mut);padding:8px 2px;border-radius:9px;font-size:11px;font-weight:600;cursor:pointer}
nav button.on{background:#27272a;color:#fff}
h2{margin:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid rgba(255,255,255,.05)}
.item:first-child{border-top:0}.item .l{min-width:0;flex:1}.item .l b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .r{display:flex;align-items:center;gap:8px;flex-shrink:0;font-weight:600;font-size:13px}
.catsel{-webkit-appearance:none;appearance:none;font-size:11px;padding:4px 8px;border-radius:8px;max-width:112px}
.in{color:#34d399}.warn{color:var(--warn)}.bad{color:var(--bad)}
.fab{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(9,9,11,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.fab .wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:#18181c;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;font-size:12px;cursor:pointer}
.btn.pri{background:#f4f4f5;color:#09090b;width:100%}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;padding:16px}
.modal.on{display:flex}.modal .card{width:100%;max-width:460px;max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal label{font-size:11px;color:var(--mut);display:block;margin-bottom:4px}.modal input,.modal select{width:100%}
.err{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);color:#fda4af;border-radius:12px;padding:10px 12px;font-size:12px;display:none}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:16px 0}
</style>
</head>
<body>
<header><div class="wrap row">
  <div><h1>Finanças</h1><div class="row" style="justify-content:flex-start;margin-top:2px"><span class="dim" id="status">Carregando…</span><button class="link" id="btn-sync">Atualizar</button></div></div>
  <select id="mes"></select>
</div></header>

<main>
  <div class="err" id="err"></div>
  <section class="card">
    <div class="row" style="align-items:flex-start">
      <div><div class="lbl">Falta pagar no mês</div><div class="big" id="falta-pagar">R$ 0,00</div></div>
      <div style="text-align:right"><div class="lbl">Sobra prevista</div><span class="pill pos" id="sobra">R$ 0,00</span></div>
    </div>
    <div class="bar"><i id="barra" style="width:0;background:var(--ok)"></i></div>
    <div class="dim" id="txt-pago"></div>
  </section>
  <section class="grid2">
    <div class="sub"><div class="lbl">Saldo conta Nubank</div><div class="mid" id="saldo">—</div><div class="dim" id="limite"></div></div>
    <div class="sub"><div class="lbl">Falta receber no mês</div><div class="mid" id="falta-receber">R$ 0,00</div><div class="dim" id="ja-entrou"></div></div>
  </section>
  <nav id="tabs">
    <button data-aba="categorias" class="on">Categorias</button><button data-aba="cartao">Extrato Nubank</button><button data-aba="banco">Extrato Banco</button><button data-aba="dinheiro">Dinheiro</button>
  </nav>
  <section class="card" id="sec-cat"><div class="row" style="margin-bottom:10px"><h2>Limites por categoria</h2></div><div id="barras"></div></section>
  <section class="card"><div class="row" style="margin-bottom:6px"><h2 id="titulo-lista">Lançamentos</h2><span class="dim">Toque na categoria para alterar</span></div><div id="lista"></div></section>
</main>

<div class="fab"><div class="wrap"><button class="btn" id="open-lanc">+ Novo lançamento</button><button class="btn" id="open-cat">Categorias e limites</button></div></div>

<div class="modal" id="m-lanc"><form class="card" id="f-lanc">
  <div class="row"><b>Novo lançamento</b><button type="button" class="link" data-close>Fechar</button></div>
  <div class="grid2"><div><label>Onde lançar</label><select id="l-mod"><option value="DINHEIRO">Dinheiro (à vista)</option><option value="FIXO">Compromisso fixo / parcelado</option></select></div>
  <div><label>Tipo</label><select id="l-tipo"><option value="SAIDA">Saída</option><option value="ENTRADA">Entrada</option></select></div></div>
  <div><label>Descrição</label><input id="l-nome" required maxlength="80"></div>
  <div class="grid2"><div><label>Valor (R$) — de cada parcela</label><input id="l-valor" type="number" step="0.01" min="0.01" required inputmode="decimal"></div>
  <div><label>Categoria</label><select id="l-cat"></select></div></div>
  <div class="grid2"><div><label>Dia</label><input id="l-dia" type="number" min="1" max="31" required></div>
  <div><label>Parcelas (só fixo)</label><input id="l-parc" type="number" min="1" max="48" value="1" required></div></div>
  <button class="btn pri" id="l-salvar">Salvar lançamento</button>
</form></div>

<div class="modal" id="m-cat"><form class="card" id="f-cat">
  <div class="row"><b>Criar ou editar categoria</b><button type="button" class="link" data-close>Fechar</button></div>
  <div><label>Nome (escolha uma existente ou digite nova)</label><input id="c-nome" list="dl-cat" required maxlength="40"><datalist id="dl-cat"></datalist></div>
  <div class="grid2"><div><label>Limite mensal (R$)</label><input id="c-lim" type="number" step="0.01" min="0" required inputmode="decimal"></div>
  <div><label>Cor</label><select id="c-cor"><option value="#38bdf8">Azul claro</option><option value="#c084fc">Roxo</option><option value="#60a5fa">Azul royal</option><option value="#fbbf24">Âmbar</option><option value="#34d399">Verde</option><option value="#f472b6">Rosa</option><option value="#a1a1aa">Cinza</option></select></div></div>
  <div><label>Palavras-chave para categorizar sozinho (separe por vírgula)</label><input id="c-kws" placeholder="drogaria, farmacia, pilates"></div>
  <button class="btn pri" id="c-salvar">Salvar categoria</button>
</form></div>

<script>
const URL_APP = "https://script.google.com/macros/s/AKfycbzNdp_jDA9za0m-jg_N1-IOjzZKDnSKnm22427gleTSKJLtXKPU1_mHYsU0emJKVTn_UQ/exec";
const CACHE_KEY = 'financas_v3';
const NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CAT_PADRAO = 'Dinheiro / Diversos';
let D = { contas:[], compromissos:[], faturasDet:[], faturas:[], transacoes:[], categoriasLimites:[], dinheiro:[], mesAtual:'' };
let aba = 'categorias';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; if (!v) return 0; let s = String(v).trim(); if (s.includes('.') && s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); else if (s.includes(',')) s = s.replace(',','.'); return parseFloat(s) || 0; };
const R = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nomeCurto = c => String(c).split('&')[0].split('/')[0].trim();
function dataBr(v){ if(!v) return ''; const s=String(v).trim(); if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)){const p=s.split('/');return p[0].padStart(2,'0')+'/'+p[1].padStart(2,'0')+'/'+p[2];} if(/^\d{4}-\d{2}-\d{2}/.test(s)){const p=s.slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0];} return s; }
const compDe = v => { const p = dataBr(v).split('/'); return p.length === 3 ? p[1] + '/' + p[2] : ''; };

/* ---------- token e rede ---------- */
function token(){ let t = localStorage.getItem('financas_token'); if (t === null) { t = prompt('Digite a senha de acesso (TOKEN_ACESSO). Deixe vazio se não configurou.') || ''; localStorage.setItem('financas_token', t); } return t; }
function mostrarErro(m){ const e = $('err'); e.textContent = m || ''; e.style.display = m ? 'block' : 'none'; }
async function api(payload){
  const body = JSON.stringify(Object.assign({ token: token() }, payload));
  const r = await fetch(URL_APP, { method:'POST', body, redirect:'follow' });
  const j = await r.json(); if (j.status !== 'SUCCESS') throw new Error(j.message || 'Falha ao gravar');
  return j;
}
async function carregar(){
  try {
    const cache = localStorage.getItem(CACHE_KEY);
    if (cache) { D = Object.assign(D, JSON.parse(cache)); iniciarMeses(); render(); $('status').textContent = 'Dados em cache…'; }
    const r = await fetch(URL_APP + '?token=' + encodeURIComponent(token()), { redirect:'follow' });
    const j = await r.json();
    if (j.message === 'TOKEN_INVALIDO') { localStorage.removeItem('financas_token'); throw new Error('Senha de acesso incorreta. Recarregue a página.'); }
    if (j.status !== 'OK') throw new Error(j.message || 'Resposta inesperada da planilha');
    D = j; try { localStorage.setItem(CACHE_KEY, JSON.stringify(j)); } catch(e){}
    mostrarErro(''); iniciarMeses(); render();
    $('status').textContent = 'Sincronizado via Open Finance';
  } catch (e) { mostrarErro('Não foi possível ler a planilha: ' + e.message + (localStorage.getItem(CACHE_KEY) ? ' (mostrando dados em cache)' : '')); $('status').textContent = 'Offline'; }
}

/* ---------- meses ---------- */
function iniciarMeses(){
  const sel = $('mes'), atual = sel.value || D.mesAtual || '10/2026';
  const idx = c => { const p = c.split('/'); return +p[1] * 12 + +p[0] - 1; };
  const [ma, aa] = (D.mesAtual || '10/2026').split('/').map(Number);
  let min = 2026 * 12 + 4, max = aa * 12 + ma - 1 + 8;
  (D.faturasDet || []).forEach(l => { const i = idx(String(l[0])); if (i > max) max = i; });
  (D.compromissos || []).forEach(c => { const t = String(c[0]).match(/\[(\d{2}\/\d{4})\]/); if (t && idx(t[1]) > max) max = idx(t[1]); });
  let h = ''; for (let i = min; i <= max; i++) { const m = String((i % 12) + 1).padStart(2,'0'), a = Math.floor(i / 12), c = m + '/' + a; h += '<option value="' + c + '">' + NOMES[i % 12] + ' ' + a + '</option>'; }
  sel.innerHTML = h; sel.value = [...sel.options].some(o => o.value === atual) ? atual : D.mesAtual;
}

/* ---------- categorias ---------- */
const cats = () => (D.categoriasLimites || []).filter(c => c[0]);
const nomesCat = () => { const n = cats().map(c => String(c[0]).trim()); return n.length ? n : [CAT_PADRAO]; };
function selectCat(id, origem, atual){
  const lista = nomesCat(); if (atual && !lista.includes(atual)) lista.push(atual);
  return '<select class="catsel" data-origem="' + origem + '" data-id="' + esc(id) + '">' + lista.map(c => '<option value="' + esc(c) + '"' + (c === atual ? ' selected' : '') + '>' + esc(nomeCurto(c)) + '</option>').join('') + '</select>';
}

/* ---------- cálculo do mês ---------- */
function calcular(mes){
  const ehAtual = mes === D.mesAtual;
  const gasto = {}, detalhe = {};
  const somar = (cat, v, txt) => { const c = cat || CAT_PADRAO; gasto[c] = (gasto[c] || 0) + v; if (txt) (detalhe[c] = detalhe[c] || []).push(txt); };
  let entPrev = 0, entRec = 0, fixPrev = 0, fixPago = 0;
  const fixas = [];

  (D.compromissos || []).forEach(c => {
    const nome = String(c[0] || ''), tag = nome.match(/\[(\d{2}\/\d{4})\]/);
    if (tag && tag[1] !== mes) return;
    const limpo = nome.replace(/\s*\[\d{2}\/\d{4}\]/g, '').trim(), tipo = String(c[1]).toUpperCase();
    const prev = num(c[2]), status = String(c[5] || 'PENDENTE').toUpperCase(), real = ehAtual ? num(c[6]) : 0;
    const cat = String(c[9] || '').trim() || CAT_PADRAO;
    if (tipo === 'ENTRADA') { entPrev += Math.max(prev, real); if (ehAtual && status.includes('RECEBIDO')) entRec += real > 0 ? real : prev; return; }
    const comp = Math.max(prev, real);
    let pago = 0; if (ehAtual && status.includes('PAGO')) pago = status.includes('PARCIAL') ? real : comp;
    const falta = Math.max(0, comp - pago);
    fixPrev += comp; fixPago += Math.min(pago, comp);
    somar(cat, comp, falta > 0 ? limpo.split('(')[0].trim() + ': ' + (pago > 0 ? 'falta ' + R(falta) + ' (parcial ' + R(pago) + ')' : R(falta)) : '');
    fixas.push({ id: nome, dia: c[3], nome: limpo, prev: comp, pago, falta, cat, status });
  });

  const itens = (D.faturasDet || []).filter(l => String(l[0]) === mes);
  const totalFatura = itens.length ? num(itens[0][3]) : 0;
  let somaItens = 0;
  itens.forEach(l => { const v = num(l[8]); somaItens += v; somar(String(l[10] || CAT_PADRAO), v, ''); });
  const ajuste = totalFatura - somaItens;
  if (itens.length && Math.abs(ajuste) > 0.05) somar('Cartões de Crédito', ajuste, 'Ajuste da fatura oficial: ' + R(ajuste));
  if (totalFatura) (detalhe['Cartões de Crédito'] = detalhe['Cartões de Crédito'] || []).unshift('Nubank: ' + R(totalFatura));

  let dinSaida = 0;
  const din = (D.dinheiro || []).filter(d => String(d[5]) === mes);
  din.forEach(d => { const v = num(d[4]); if (String(d[3]).toUpperCase() === 'SAIDA') { dinSaida += v; somar(String(d[2] || CAT_PADRAO), v, d[1] + ': ' + R(v)); } else { entPrev += v; entRec += v; } });

  const totalDesp = fixPrev + totalFatura + dinSaida, pago = fixPago + dinSaida;
  return { gasto, detalhe, fixas, itens, din, totalFatura, totalDesp, pago, falta: Math.max(0, totalDesp - pago), entPrev, entRec, faltaReceber: Math.max(0, entPrev - entRec), sobra: entPrev - totalDesp };
}

/* ---------- render ---------- */
function render(){
  const mes = $('mes').value || D.mesAtual, c = calcular(mes);
  const cc = (D.contas || []).find(x => String(x[2]).toLowerCase().includes('corrente')), cr = (D.contas || []).find(x => String(x[2]).toLowerCase().includes('crédito'));
  $('saldo').textContent = cc ? R(num(cc[5])) : '—'; $('limite').textContent = cr ? 'Limite disp.: ' + R(num(cr[8])) : '';
  $('falta-pagar').textContent = R(c.falta);
  const perc = c.totalDesp > 0 ? Math.min(100, c.pago / c.totalDesp * 100) : 0;
  $('barra').style.width = perc + '%'; $('txt-pago').textContent = 'Já pago: ' + R(c.pago) + ' (' + Math.round(perc) + '%) • Total: ' + R(c.totalDesp);
  $('falta-receber').textContent = R(c.faltaReceber); $('ja-entrou').textContent = 'Já entrou: ' + R(c.entRec);
  const s = $('sobra'); s.textContent = (c.sobra >= 0 ? '+' : '-') + R(Math.abs(c.sobra)); s.className = 'pill ' + (c.sobra >= 0 ? 'pos' : 'neg');

  $('sec-cat').style.display = aba === 'categorias' ? '' : 'none';
  $('barras').innerHTML = cats().map(r => {
    const nome = String(r[0]).trim(), lim = num(r[1]), g = c.gasto[nome] || 0, p = lim > 0 ? Math.min(100, g / lim * 100) : 0;
    const cor = lim > 0 && g > lim ? 'var(--bad)' : (lim > 0 && g > lim * .85 ? 'var(--warn)' : String(r[2] || '#38bdf8'));
    const sub = (c.detalhe[nome] || []).slice(0, 3).join(' • ');
    return '<div style="margin-bottom:14px"><div class="row" style="font-size:13px"><b>' + esc(nome) + '</b><span><b>' + R(g) + '</b> <span class="dim">/ ' + R(lim) + '</span></span></div><div class="bar"><i style="width:' + p + '%;background:' + esc(cor) + '"></i></div>' + (sub ? '<div class="dim">' + esc(sub) + '</div>' : '') + '</div>';
  }).join('') || '<div class="empty">Nenhuma categoria cadastrada.</div>';

  const L = []; let titulo = 'Lançamentos do mês';
  if (aba === 'categorias' || aba === 'cartao') {
    titulo = aba === 'cartao' ? 'Extrato Nubank — ' + mes : 'Lançamentos do mês — ' + mes;
    c.itens.forEach(l => L.push({ id: String(l[9]), data: String(l[5]).slice(0,5), nome: l[6], sub: String(l[7]) + (String(l[4]) === 'PROJEÇÃO' ? ' • projetada' : ''), val: num(l[8]), cat: String(l[10] || CAT_PADRAO), origem: 'TRANSACAO', cartao: true }));
    if (aba === 'categorias') {
      c.fixas.forEach(f => L.push({ id: f.id, data: 'Dia ' + String(f.dia).padStart(2,'0'), nome: f.nome, sub: 'Compromisso fixo • ' + (f.pago >= f.prev ? 'pago' : f.pago > 0 ? 'parcial' : 'pendente'), val: f.prev, cat: f.cat, origem: 'FIXA' }));
      c.din.forEach(d => L.push({ id: String(d[6]), data: String(d[0]).slice(0,5), nome: d[1], sub: 'Dinheiro', val: num(d[4]), cat: String(d[2]), origem: 'DINHEIRO', entrada: String(d[3]).toUpperCase() === 'ENTRADA' }));
    }
  } else if (aba === 'banco') {
    titulo = 'Extrato conta corrente — ' + mes;
    (D.transacoes || []).filter(t => compDe(t[0]) === mes).forEach(t => L.push({ id: String(t[13]), data: dataBr(t[0]).slice(0,5), nome: t[3], sub: (t[9] || 'Movimentação') + ' • ' + (t[11] || t[10] || 'Conta Nubank'), val: Math.abs(num(t[7])), cat: String(t[14] || t[5] || CAT_PADRAO), origem: 'TRANSACAO', entrada: String(t[6]).toUpperCase() === 'CREDIT' }));
  } else {
    titulo = 'Dinheiro e compromissos — ' + mes;
    c.din.forEach(d => L.push({ id: String(d[6]), data: String(d[0]).slice(0,5), nome: d[1], sub: 'Dinheiro', val: num(d[4]), cat: String(d[2]), origem: 'DINHEIRO', entrada: String(d[3]).toUpperCase() === 'ENTRADA' }));
    c.fixas.forEach(f => L.push({ id: f.id, data: 'Dia ' + String(f.dia).padStart(2,'0'), nome: f.nome, sub: 'Fixo • ' + f.status, val: f.prev, cat: f.cat, origem: 'FIXA' }));
  }
  $('titulo-lista').textContent = titulo;
  $('lista').innerHTML = L.length ? L.map(i => '<div class="item"><div class="l"><b>' + esc(i.data) + ' • ' + esc(i.nome) + '</b><span class="dim">' + esc(i.sub) + '</span></div><div class="r"><span class="' + (i.entrada || i.val < 0 ? 'in' : '') + '">' + (i.entrada || i.val < 0 ? '+' : '') + R(Math.abs(i.val)) + '</span>' + selectCat(i.id, i.origem, i.cat) + '</div></div>').join('') : '<div class="empty">Nenhum lançamento neste mês.</div>';

  const opts = nomesCat();
  $('l-cat').innerHTML = '<option value="">Detectar automaticamente</option>' + opts.map(n => '<option value="' + esc(n) + '">' + esc(n) + '</option>').join('');
  $('dl-cat').innerHTML = opts.map(n => '<option value="' + esc(n) + '">').join('');
}

/* ---------- eventos ---------- */
$('mes').addEventListener('change', render);
$('tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; aba = b.dataset.aba; [...$('tabs').children].forEach(x => x.classList.toggle('on', x === b)); render(); });
$('lista').addEventListener('change', async e => {
  const s = e.target.closest('.catsel'); if (!s) return;
  const { origem, id } = s.dataset, nova = s.value;
  const alvo = origem === 'TRANSACAO' ? (D.transacoes || []).find(t => String(t[13]) === id) : origem === 'FIXA' ? (D.compromissos || []).find(c => String(c[0]) === id) : (D.dinheiro || []).find(d => String(d[6]) === id);
  if (origem === 'TRANSACAO') { if (alvo) alvo[14] = nova; (D.faturasDet || []).forEach(l => { if (String(l[9]).split('_proj_')[0] === id.split('_proj_')[0]) l[10] = nova; }); }
  else if (alvo) alvo[origem === 'FIXA' ? 9 : 2] = nova;
  render();
  try { await api({ acao: 'ALTERAR_CATEGORIA', origem, id, novaCategoria: nova }); mostrarErro(''); localStorage.setItem(CACHE_KEY, JSON.stringify(D)); }
  catch (err) { mostrarErro('A categoria foi alterada só na tela; não gravou na planilha: ' + err.message); }
});
const abrir = id => $(id).classList.add('on'), fechar = id => $(id).classList.remove('on');
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => fechar(b.closest('.modal').id)));
document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) fechar(m.id); }));
$('open-lanc').onclick = () => { $('l-dia').value = new Date().getDate(); abrir('m-lanc'); };
$('open-cat').onclick = () => abrir('m-cat');
$('c-nome').addEventListener('change', () => { const r = cats().find(x => String(x[0]).trim().toLowerCase() === $('c-nome').value.trim().toLowerCase()); if (r) { $('c-lim').value = num(r[1]); $('c-kws').value = r[3] || ''; if ([...$('c-cor').options].some(o => o.value === r[2])) $('c-cor').value = r[2]; } });

async function enviar(form, btn, rotulo, payload, aoFim){
  btn.disabled = true; btn.textContent = 'Salvando…';
  try { await api(payload); form.reset(); fechar(form.parentElement.id); await carregar(); if (aoFim) aoFim(); }
  catch (err) { alert('Erro ao salvar: ' + err.message); }
  finally { btn.disabled = false; btn.textContent = rotulo; }
}
$('f-lanc').addEventListener('submit', e => { e.preventDefault();
  enviar(e.target, $('l-salvar'), 'Salvar lançamento', { acao:'NOVO_LANCAMENTO', modalidade:$('l-mod').value, tipo:$('l-tipo').value, nome:$('l-nome').value.trim(), valor:$('l-valor').value, categoria:$('l-cat').value, dia:$('l-dia').value, parcelas:$('l-parc').value, competenciaInicial:$('mes').value });
});
$('f-cat').addEventListener('submit', e => { e.preventDefault();
  enviar(e.target, $('c-salvar'), 'Salvar categoria', { acao:'SALVAR_CATEGORIA', categoria:$('c-nome').value.trim(), limite:$('c-lim').value, cor:$('c-cor').value, palavrasChave:$('c-kws').value });
});
$('btn-sync').addEventListener('click', async () => {
  const b = $('btn-sync'); b.textContent = 'Sincronizando…'; b.disabled = true;
  try { await api({ acao:'SYNC_PLUGGY' }); await carregar(); } catch (e) { mostrarErro('Falha ao sincronizar: ' + e.message); } finally { b.textContent = 'Atualizar'; b.disabled = false; }
});

iniciarMeses(); render(); carregar();
</script>
</body>
</html>
