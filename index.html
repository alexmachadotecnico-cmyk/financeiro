<script>
    const URL_DO_WEB_APP = "https://script.google.com/macros/s/AKfycbzNdp_jDA9za0m-jg_N1-IOjzZKDnSKnm22427gleTSKJLtXKPU1_mHYsU0emJKVTn_UQ/exec";

    let abaAtual = 'categorias';
    let mapaFaturasNubank = {};

    const CATEGORIAS_PADRAO = [
      ["Saúde & Bem-Estar", 1000.00, "#38bdf8", "pilates, nattalia, terapia, michelle, drogaria, rosario, farmacia"],
      ["Cartões de Crédito", 1800.00, "#c084fc", "nubank, havan, riachuelo, midway, fatura"],
      ["Consórcio & Bancos", 500.00, "#60a5fa", "klubi, consorcio, santander, boleto"],
      ["Contas & Assinaturas", 300.00, "#fbbf24", "tim, shalom, openai, zotlo, jusbrasil, demerge, google"],
      ["Compras & Educação", 400.00, "#f472b6", "mercadolivre, livraria, vozes, amazon, shopee"],
      ["Alimentação & Mercado", 600.00, "#34d399", "ifood, panificadora, supermercado, almoco, hiper"],
      ["Dinheiro / Diversos", 300.00, "#a1a1aa", "dinheiro, saque, diversos, outros"]
    ];

    let dados = {
      contas: [
        ["Nu Pagamentos S.A.", "Conta Corrente", "Conta Corrente", "04804781-6", "Alex", 107.68, "", "", "", ""],
        ["Nu Pagamentos S.A.", "Cartão gold", "Cartão de Crédito", "8240", "Alex", 1882.75, "", "", 205.25, 2088.00]
      ],
      categoriasLimites: [...CATEGORIAS_PADRAO],
      compromissos: [
        ["Pilates (Nattalia)", "SAIDA", 320.00, 10, "Nattalia Renata", "PAGO (Parcial)", 50.00, "09/10/2026", "93f974e9", "Saúde & Bem-Estar"],
        ["Terapia (Michelle)", "SAIDA", 550.00, 17, "Michelle dos santos Branquinho", "PENDENTE", "", "", "", "Saúde & Bem-Estar"],
        ["TIM", "SAIDA", 71.52, 28, "TIM", "PENDENTE", "", "", "", "Contas & Assinaturas"],
        ["Fatura Havan", "SAIDA", 119.19, 20, "Havan", "PENDENTE", "", "", "", "Cartões de Crédito"],
        ["Fatura Riachuelo (Midway)", "SAIDA", 124.45, 20, "Midway", "PENDENTE", "", "", "", "Cartões de Crédito"],
        ["Consórcio Klubi", "SAIDA", 253.94, 10, "Klubi", "PENDENTE", "", "", "", "Consórcio & Bancos"],
        ["Santander (Boleto)", "SAIDA", 85.30, 5, "Santander", "PAGO", 85.30, "07/10/2026", "4a4f3dd3", "Consórcio & Bancos"],
        ["Shalom", "SAIDA", 53.90, 21, "Shalom", "PENDENTE", "", "", "", "Contas & Assinaturas"],
        ["Entrada Fixa Mensal (Padre Clemente)", "ENTRADA", 500.00, 2, "Klemens Deja", "RECEBIDO", 500.00, "07/10/2026", "889d681b", "Entradas"],
        ["Apoio Familiar", "ENTRADA", 1500.00, 10, "Ari Machado", "RECEBIDO", 1500.00, "05/10/2026", "8d8b0ac7", "Entradas"],
        ["Entrada Fixa Hiper", "ENTRADA", 321.50, 15, "Amanda Baby", "RECEBIDO (Parcial)", 200.00, "08/10/2026", "6bca8040", "Entradas"],
        ["Ajuda para Pilates", "ENTRADA", 320.00, 10, "M. Machado Panificadora", "RECEBIDO", 320.00, "09/10/2026", "f2c8d9e7", "Entradas"],
        ["Ajuda para Terapia", "ENTRADA", 550.00, 17, "Maria da Piedade", "PENDENTE", "", "", "", "Entradas"]
      ],
      faturas: [
        ["gold", "14/10/2026", 1166.11, 174.92, "CLOSED", "bill_10"],
        ["gold", "14/09/2026", 1449.18, 217.38, "CLOSED", "bill_09"],
        ["gold", "16/08/2026", 909.67, 136.45, "CLOSED", "bill_08"]
      ],
      transacoes: [],
      dinheiro: []
    };

    function num(v) {
      if (typeof v === 'number') return isNaN(v) ? 0 : v;
      if (!v) return 0;
      let s = String(v).trim();
      if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      else if (s.includes(',')) s = s.replace(',', '.');
      return parseFloat(s) || 0;
    }

    function moeda(v) {
      return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function dataBr(val) {
      if (!val) return '';
      let s = String(val).trim();
      if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
        const p = s.split('/');
        return p[0].padStart(2, '0') + '/' + p[1].padStart(2, '0') + '/' + p[2];
      }
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) {
        const p = s.substring(0, 10).split('-');
        return p[2] + '/' + p[1] + '/' + p[0];
      }
      const d = new Date(s);
      if (!isNaN(d.getTime())) {
        return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
      }
      return s;
    }

    function somarDiasBr(strDataBr, dias) {
      if (!dias) return strDataBr;
      const p = String(strDataBr).split('/');
      if (p.length !== 3) return strDataBr;
      const d = new Date(Date.UTC(parseInt(p[2], 10), parseInt(p[1], 10) - 1, parseInt(p[0], 10) + dias));
      return String(d.getUTCDate()).padStart(2, '0') + '/' + String(d.getUTCMonth() + 1).padStart(2, '0') + '/' + d.getUTCFullYear();
    }

    function autoCategorizarLocal(texto) {
      const t = String(texto || '').toLowerCase();
      const listaCat = (dados.categoriasLimites && dados.categoriasLimites.length) ? dados.categoriasLimites : CATEGORIAS_PADRAO;
      for (let i = 0; i < listaCat.length; i++) {
        const nomeCat = String(listaCat[i][0] || '').trim();
        const kws = String(listaCat[i][3] || '').toLowerCase().split(',');
        for (let k = 0; k < kws.length; k++) {
          const termo = kws[k].trim();
          if (termo && t.includes(termo)) return nomeCat;
        }
      }
      if (t.includes('drogaria') || t.includes('pilates') || t.includes('terapia')) return 'Saúde & Bem-Estar';
      if (t.includes('mercadolivre') || t.includes('livraria')) return 'Compras & Educação';
      if (t.includes('havan') || t.includes('riachuelo') || t.includes('midway')) return 'Cartões de Crédito';
      if (t.includes('klubi') || t.includes('santander')) return 'Consórcio & Bancos';
      if (t.includes('tim') || t.includes('shalom') || t.includes('openai') || t.includes('jusbrasil') || t.includes('demerge')) return 'Contas & Assinaturas';
      if (t.includes('almoco') || t.includes('ifood') || t.includes('panificadora')) return 'Alimentação & Mercado';
      return 'Dinheiro / Diversos';
    }

    function processarFaturasNubank() {
      mapaFaturasNubank = {};
      const oficiais = {};
      (dados.faturas || []).forEach(f => {
        const v = dataBr(f[1]);
        const p = v.split('/');
        if (p.length === 3) {
          oficiais[p[1] + '/' + p[2]] = Number(num(f[2]).toFixed(2));
        }
      });

      const txs = dados.transacoes || [];
      let qtd07 = 0, qtd08 = 0;
      txs.forEach(tx => {
        const origem = String(tx[2] || '').toLowerCase();
        const conta = String(tx[1] || '').toLowerCase();
        if (!origem.includes('crédito') && !conta.includes('gold')) return;
        const txtP = String(tx[3] || '') + ' ' + String(tx[8] || '');
        if (/\b([2-9]|1\d)\/\d{1,2}\b/.test(txtP)) {
          const p = dataBr(tx[0]).split('/');
          if (p.length === 3 && parseInt(p[2], 10) === 2026 && parseInt(p[1], 10) <= 10) {
            if (parseInt(p[0], 10) === 7) qtd07++;
            if (parseInt(p[0], 10) === 8) qtd08++;
          }
        }
      });
      const deslocamento = (qtd07 > qtd08) ? 1 : 0;

      const porComp = {};
      txs.forEach(tx => {
        const origem = String(tx[2] || '').toLowerCase();
        const conta = String(tx[1] || '').toLowerCase();
        if (!origem.includes('crédito') && !conta.includes('gold')) return;

        const dOrig = dataBr(tx[0]);
        if (!dOrig) return;
        const dReal = somarDiasBr(dOrig, deslocamento);
        const p = dReal.split('/');
        if (p.length !== 3) return;
        const dia = parseInt(p[0], 10), mes = parseInt(p[1], 10), ano = parseInt(p[2], 10);

        const desc = String(tx[3] || '').trim();
        if (desc.toLowerCase().includes('pagamento recebido') || desc.toLowerCase().includes('pagamento de fatura')) return;

        const dir = String(tx[6] || '').toUpperCase();
        const valAbs = Math.abs(num(tx[7]));
        if (valAbs === 0) return;
        const ehEstorno = (dir === 'CREDIT' || num(tx[7]) < 0);
        const valFinal = ehEstorno ? -valAbs : valAbs;

        let mesFat = dia >= 8 ? mes + 1 : mes;
        let anoFat = ano;
        if (mesFat > 12) { mesFat = 1; anoFat++; }
        const comp = String(mesFat).padStart(2, '0') + '/' + anoFat;

        const catSalva = String(tx[5] || '').trim();
        const catAtual = (catSalva && catSalva !== 'Sem categoria') ? catSalva : autoCategorizarLocal(desc);

        if (!porComp[comp]) porComp[comp] = [];
        porComp[comp].push({
          id: String(tx[13] || ''),
          dataCurta: p[0] + '/' + p[1],
          descricao: desc,
          categoria: catAtual,
          valor: valFinal,
          ehEstorno: ehEstorno,
          origemTipo: 'TRANSACAO'
        });
      });

      Object.keys(porComp).forEach(comp => {
        const soma = Number(porComp[comp].reduce((a, b) => a + b.valor, 0).toFixed(2));
        const valOficial = oficiais[comp];
        mapaFaturasNubank[comp] = {
          valorTotal: (valOficial !== undefined && Math.abs(valOficial - soma) <= 0.05) ? valOficial : (valOficial || soma),
          itens: porComp[comp]
        };
      });

      Object.keys(oficiais).forEach(comp => {
        if (!mapaFaturasNubank[comp]) {
          mapaFaturasNubank[comp] = { valorTotal: oficiais[comp], itens: [] };
        }
      });
    }

    function selecionarAba(aba) {
      abaAtual = aba;
      ['categorias', 'cartao', 'banco', 'dinheiro'].forEach(id => {
        const btn = document.getElementById('aba-btn-' + id);
        if (!btn) return;
        btn.className = (id === aba)
          ? "py-1.5 rounded-lg bg-zinc-800 text-white border border-white/10 transition"
          : "py-1.5 rounded-lg text-zinc-400 hover:text-zinc-200 transition";
      });
      renderizarInterface();
    }

    function obterListaCategoriasNomes() {
      const base = (dados.categoriasLimites && dados.categoriasLimites.length) ? dados.categoriasLimites : CATEGORIAS_PADRAO;
      return base.map(c => String(c[0]).trim()).filter(Boolean);
    }

    function renderizarSelectCategoriaItem(idItem, origemTipo, catAtual) {
      const todasCats = obterListaCategoriasNomes();
      const nomeCurto = (c) => c.split('&')[0].split('/')[0].trim();
      const idSeguro = encodeURIComponent(String(idItem || ''));
      const opcoes = todasCats.map(c =>
        `<option value="${c}" ${c === catAtual ? 'selected' : ''} class="bg-zinc-900 text-white">${nomeCurto(c)}</option>`
      ).join('');

      return `
        <select data-origem="${origemTipo}" data-id="${idSeguro}" onchange="dispararTrocaCategoria(this)"
          class="cat-pill text-[11px] font-medium px-2.5 py-1 rounded-md bg-zinc-800/90 text-zinc-200 border border-white/10 focus:outline-none cursor-pointer">
          ${opcoes}
        </select>
      `;
    }

    function dispararTrocaCategoria(selectEl) {
      const origemTipo = selectEl.getAttribute('data-origem');
      const idItem = decodeURIComponent(selectEl.getAttribute('data-id') || '');
      const novaCat = selectEl.value;
      alterarCategoriaItem(origemTipo, idItem, novaCat);
    }

    function renderizarInterface() {
      try {
        processarFaturasNubank();
        const selectMes = document.getElementById('filtro-mes');
        const mesSelecionado = selectMes ? selectMes.value : '10/2026';
        const ehOutubro2026 = (mesSelecionado === '10/2026');

        // 1. Saldo e Limite da aba Contas
        (dados.contas || []).forEach(c => {
          const tipo = String(c[2] || '').toLowerCase();
          if (tipo.includes('corrente')) {
            document.getElementById('card-saldo-nubank').innerText = 'R$ ' + moeda(num(c[5]));
          } else if (tipo.includes('crédito')) {
            document.getElementById('card-limite-nubank').innerText = 'Limite disp.: R$ ' + moeda(num(c[8]));
          }
        });

        let totalEntradasPrevisto = 0;
        let totalEntradasRecebido = 0;
        let totalFixasPrevisto = 0;
        let totalFixasPago = 0;

        const baseCats = (dados.categoriasLimites && dados.categoriasLimites.length) ? dados.categoriasLimites : CATEGORIAS_PADRAO;
        const gastosPorCategoria = {};
        const detalhesPorCategoria = {};

        baseCats.forEach(c => {
          const nomeCat = String(c[0]).trim();
          gastosPorCategoria[nomeCat] = 0;
          detalhesPorCategoria[nomeCat] = [];
        });

        const somarNaCategoria = (cat, valor, detalhe) => {
          const c = cat || 'Dinheiro / Diversos';
          if (gastosPorCategoria[c] === undefined) {
            gastosPorCategoria[c] = 0;
            detalhesPorCategoria[c] = [];
          }
          gastosPorCategoria[c] += valor;
          if (detalhe) detalhesPorCategoria[c].push(detalhe);
        };

        // 2. Processa Compromissos Fixos
        (dados.compromissos || []).forEach(item => {
          const nome = String(item[0] || '');
          const matchTag = nome.match(/\[(\d{2}\/\d{4})\]/);
          if (matchTag && matchTag[1] !== mesSelecionado) return;

          const nomeLimpo = nome.replace(/\s*\[\d{2}\/\d{4}\]/g, '').trim();
          const tipo = String(item[1] || '').toUpperCase();
          const previsto = num(item[2]);
          const status = String(item[5] || 'PENDENTE').toUpperCase();
          const real = ehOutubro2026 ? num(item[6]) : 0;
          const cat = String(item[9] || '').trim() || autoCategorizarLocal(nomeLimpo);

          if (tipo === 'ENTRADA') {
            totalEntradasPrevisto += previsto;
            if (ehOutubro2026 && status.includes('RECEBIDO')) {
              totalEntradasRecebido += (real > 0 ? real : previsto);
            }
          } else if (tipo === 'SAIDA') {
            const compromissado = Math.max(previsto, real);
            totalFixasPrevisto += compromissado;

            let pagoItem = 0;
            if (ehOutubro2026 && status.includes('PAGO')) {
              pagoItem = status.includes('PARCIAL') ? real : compromissado;
            }
            totalFixasPago += pagoItem;

            const faltaItem = Math.max(0, compromissado - pagoItem);
            let txtDet = '';
            if (pagoItem > 0 && faltaItem > 0) {
              txtDet = `${nomeLimpo.split('(')[0].trim()}: falta R$ ${moeda(faltaItem)} (pago parcial R$ ${moeda(pagoItem)})`;
            } else if (faltaItem > 0) {
              txtDet = `${nomeLimpo.split('(')[0].trim()}: R$ ${moeda(faltaItem)}`;
            }
            somarNaCategoria(cat, compromissado, txtDet);
          }
        });

        // 3. Soma Fatura do Nubank do mês selecionado
        const faturaMesObj = mapaFaturasNubank[mesSelecionado] || { valorTotal: 0, itens: [] };
        const valorFaturaNubank = num(faturaMesObj.valorTotal);
        if (valorFaturaNubank > 0) {
          somarNaCategoria('Cartões de Crédito', valorFaturaNubank, `Nubank Gold: R$ ${moeda(valorFaturaNubank)}`);
        }

        // 4. Soma Lançamentos Manuais em Dinheiro
        let totalDinheiroSaida = 0;
        (dados.dinheiro || []).forEach(d => {
          if (String(d[5] || '') !== mesSelecionado) return;
          const tipoDin = String(d[3] || 'SAIDA').toUpperCase();
          const valDin = num(d[4]);
          const catDin = String(d[2] || 'Dinheiro / Diversos');
          if (tipoDin === 'SAIDA') {
            totalDinheiroSaida += valDin;
            somarNaCategoria(catDin, valDin, `${d[1]}: R$ ${moeda(valDin)}`);
          } else {
            totalEntradasPrevisto += valDin;
            totalEntradasRecebido += valDin;
          }
        });

        const totalDespesasMes = totalFixasPrevisto + valorFaturaNubank + totalDinheiroSaida;
        const totalJaPagoMes = totalFixasPago + totalDinheiroSaida;
        const faltaPagarMes = Math.max(0, totalDespesasMes - totalJaPagoMes);
        const faltaReceberMes = Math.max(0, totalEntradasPrevisto - totalEntradasRecebido);
        const sobraPrevistaMes = totalEntradasPrevisto - totalDespesasMes;
        const percPago = totalDespesasMes > 0 ? Math.min(100, Math.round((totalJaPagoMes / totalDespesasMes) * 100)) : 0;

        document.getElementById('card-falta-pagar').innerText = 'R$ ' + moeda(faltaPagarMes);
        document.getElementById('barra-geral-pago').style.width = Math.max(4, percPago) + '%';
        document.getElementById('texto-pago-total').innerText = `Já pago: R$ ${moeda(totalJaPagoMes)} • Total: R$ ${moeda(totalDespesasMes)}`;
        document.getElementById('card-falta-receber').innerText = 'R$ ' + moeda(faltaReceberMes);
        document.getElementById('card-ja-entrou').innerText = `(Já entrou: R$ ${moeda(totalEntradasRecebido)})`;

        const elSobra = document.getElementById('card-sobra-prevista');
        elSobra.innerText = (sobraPrevistaMes >= 0 ? '+R$ ' : '-R$ ') + moeda(Math.abs(sobraPrevistaMes));
        elSobra.className = sobraPrevistaMes >= 0
          ? "text-xs font-semibold px-2.5 py-1 rounded-md bg-emerald-500/15 text-emerald-400 border border-emerald-500/25 inline-block mt-1"
          : "text-xs font-semibold px-2.5 py-1 rounded-md bg-rose-500/15 text-rose-400 border border-rose-500/25 inline-block mt-1";

        // 5. Desenha Barras Horizontais de Categorias
        const containerBarras = document.getElementById('lista-barras-categorias');
        containerBarras.innerHTML = baseCats.map(catRow => {
          const nomeCat = String(catRow[0]).trim();
          const limiteCat = num(catRow[1]);
          const corHex = String(catRow[2] || '#38bdf8');
          const gastoAtual = gastosPorCategoria[nomeCat] || 0;
          const pct = limiteCat > 0 ? Math.min(100, Math.round((gastoAtual / limiteCat) * 100)) : 0;
          const corBarra = (limiteCat > 0 && gastoAtual > limiteCat) ? '#f43f5e' : corHex;
          const subtexto = (detalhesPorCategoria[nomeCat] || []).slice(0, 3).join(' • ');

          return `
            <div class="space-y-1.5">
              <div class="flex justify-between items-baseline text-xs">
                <span class="font-medium text-zinc-100">${nomeCat} • <strong class="text-white">R$ ${moeda(gastoAtual)}</strong> <span class="text-zinc-400 font-normal">/ R$ ${moeda(limiteCat)}</span></span>
              </div>
              <div class="w-full h-2 bg-zinc-800/90 rounded-full overflow-hidden">
                <div class="h-full rounded-full transition-all duration-500" style="width: ${pct}%; background-color: ${corBarra}"></div>
              </div>
              ${subtexto ? `<p class="text-[10px] text-zinc-400 leading-tight">${subtexto}</p>` : ''}
            </div>
          `;
        }).join('');

        renderizarListaExtrato(mesSelecionado, faturaMesObj);
        popularSelectsDeCategoriasNosModais();
      } catch (err) {
        console.error("Erro ao renderizar interface:", err);
      }
    }

    function renderizarListaExtrato(mesSelecionado, faturaMesObj) {
      const container = document.getElementById('lista-lancamentos-mes');
      const titulo = document.getElementById('titulo-lista-extrato');
      let itensParaExibir = [];

      if (abaAtual === 'categorias' || abaAtual === 'cartao') {
        titulo.innerText = abaAtual === 'cartao'
          ? `Extrato Cartão Nubank (${mesSelecionado})`
          : `Lançamentos do Mês (${mesSelecionado})`;

        (faturaMesObj.itens || []).forEach(it => {
          itensParaExibir.push({
            id: it.id,
            data: it.dataCurta,
            descricao: it.descricao,
            valor: it.valor,
            categoria: it.categoria,
            origemTipo: 'TRANSACAO',
            subtitulo: it.ehEstorno ? 'Estorno / Crédito na fatura' : 'Cartão Nubank'
          });
        });

        if (abaAtual === 'categorias') {
          (dados.compromissos || []).filter(c => String(c[1]).toUpperCase() === 'SAIDA').forEach(c => {
            const nome = String(c[0]);
            const matchTag = nome.match(/\[(\d{2}\/\d{4})\]/);
            if (matchTag && matchTag[1] !== mesSelecionado) return;
            itensParaExibir.push({
              id: nome,
              data: 'Dia ' + String(c[3]).padStart(2, '0'),
              descricao: nome.replace(/\s*\[\d{2}\/\d{4}\]/g, '').trim(),
              valor: num(c[2]),
              categoria: String(c[9] || '').trim() || autoCategorizarLocal(nome),
              origemTipo: 'FIXA',
              subtitulo: 'Compromisso Fixo • ' + (mesSelecionado === '10/2026' ? (c[5] || 'PENDENTE') : 'PREVISTO')
            });
          });

          (dados.dinheiro || []).filter(d => String(d[5]) === mesSelecionado).forEach(d => {
            itensParaExibir.push({
              id: String(d[6]),
              data: String(d[0]).substring(0, 5),
              descricao: String(d[1]),
              valor: num(d[4]),
              categoria: String(d[2]),
              origemTipo: 'DINHEIRO',
              subtitulo: 'Inserido manualmente em dinheiro'
            });
          });
        }
      } else if (abaAtual === 'banco') {
        titulo.innerText = `Extrato Conta Corrente (${mesSelecionado})`;
        (dados.transacoes || []).forEach(tx => {
          const origem = String(tx[2] || '').toLowerCase();
          if (origem.includes('crédito')) return;
          const dBr = dataBr(tx[0]);
          const p = dBr.split('/');
          if (p.length === 3 && (p[1] + '/' + p[2]) === mesSelecionado) {
            const desc = String(tx[3] || '');
            const cat = (tx[5] && tx[5] !== 'Sem categoria') ? String(tx[5]) : autoCategorizarLocal(desc);
            itensParaExibir.push({
              id: String(tx[13] || ''),
              data: p[0] + '/' + p[1],
              descricao: desc,
              valor: Math.abs(num(tx[7])),
              categoria: cat,
              origemTipo: 'TRANSACAO',
              subtitulo: (tx[9] || 'Movimentação') + ' • ' + (tx[11] || tx[10] || 'Conta Nubank')
            });
          }
        });
      } else if (abaAtual === 'dinheiro') {
        titulo.innerText = `Lançamentos em Dinheiro & Contas Fixas (${mesSelecionado})`;
        (dados.dinheiro || []).filter(d => String(d[5]) === mesSelecionado).forEach(d => {
          itensParaExibir.push({
            id: String(d[6]),
            data: String(d[0]).substring(0, 5),
            descricao: String(d[1]),
            valor: num(d[4]),
            categoria: String(d[2]),
            origemTipo: 'DINHEIRO',
            subtitulo: 'Lançamento em espécie (Dinheiro)'
          });
        });

        (dados.compromissos || []).filter(c => String(c[1]).toUpperCase() === 'SAIDA').forEach(c => {
          const nome = String(c[0]);
          itensParaExibir.push({
            id: nome,
            data: 'Dia ' + String(c[3]).padStart(2, '0'),
            descricao: nome,
            valor: num(c[2]),
            categoria: String(c[9] || '').trim() || autoCategorizarLocal(nome),
            origemTipo: 'FIXA',
            subtitulo: 'Compromisso fixo • ' + (c[5] || 'PENDENTE')
          });
        });
      }

      if (itensParaExibir.length === 0) {
        container.innerHTML = `<p class="text-xs text-zinc-500 py-4 text-center">Nenhum lançamento encontrado neste filtro para ${mesSelecionado}.</p>`;
        return;
      }

      container.innerHTML = itensParaExibir.map(item => `
        <div class="py-2.5 flex justify-between items-center gap-2">
          <div class="min-w-0 flex-1">
            <p class="text-xs font-medium text-zinc-100 truncate">${item.data} • ${item.descricao}</p>
            <span class="text-[10px] text-zinc-500 block truncate">${item.subtitulo}</span>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="text-xs font-semibold text-zinc-200">R$ ${moeda(Math.abs(item.valor))}</span>
            ${renderizarSelectCategoriaItem(item.id, item.origemTipo, item.categoria)}
          </div>
        </div>
      `).join('');
    }

    async function alterarCategoriaItem(origemTipo, idItem, novaCategoria) {
      if (origemTipo === 'TRANSACAO') {
        const tx = (dados.transacoes || []).find(t => String(t[13]) === idItem);
        if (tx) tx[5] = novaCategoria;
      } else if (origemTipo === 'FIXA') {
        const fx = (dados.compromissos || []).find(c => String(c[0]) === idItem);
        if (fx) fx[9] = novaCategoria;
      } else if (origemTipo === 'DINHEIRO') {
        const dn = (dados.dinheiro || []).find(d => String(d[6]) === idItem);
        if (dn) dn[2] = novaCategoria;
      }
      renderizarInterface();

      try {
        await fetch(URL_DO_WEB_APP, {
          method: 'POST',
          body: JSON.stringify({
            acao: 'ALTERAR_CATEGORIA',
            origem: origemTipo,
            id: idItem,
            novaCategoria: novaCategoria
          })
        });
      } catch (e) {
        console.error('Erro ao salvar categoria:', e);
      }
    }

    function popularSelectsDeCategoriasNosModais() {
      const cats = obterListaCategoriasNomes();
      const selectLanc = document.getElementById('lanc-categoria');
      const datalistCat = document.getElementById('datalist-categorias');
      if (selectLanc) {
        selectLanc.innerHTML = `<option value="">Detectar automaticamente</option>` +
          cats.map(c => `<option value="${c}">${c}</option>`).join('');
      }
      if (datalistCat) {
        datalistCat.innerHTML = cats.map(c => `<option value="${c}">`).join('');
      }
    }

    function abrirModalLancamento() {
      document.getElementById('modal-lancamento').classList.remove('hidden');
      document.getElementById('modal-lancamento').classList.add('flex');
    }
    function fecharModalLancamento() {
      document.getElementById('modal-lancamento').classList.add('hidden');
      document.getElementById('modal-lancamento').classList.remove('flex');
    }
    function abrirModalCategorias() {
      document.getElementById('modal-categorias').classList.remove('hidden');
      document.getElementById('modal-categorias').classList.add('flex');
    }
    function fecharModalCategorias() {
      document.getElementById('modal-categorias').classList.add('hidden');
      document.getElementById('modal-categorias').classList.remove('flex');
    }

    async function salvarNovoLancamento(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-salvar-lanc');
      btn.innerText = "Salvando...";
      btn.disabled = true;

      const nome = document.getElementById('lanc-nome').value;
      const catEscolhida = document.getElementById('lanc-categoria').value || autoCategorizarLocal(nome);

      const payload = {
        acao: 'NOVO_LANCAMENTO',
        modalidade: document.getElementById('lanc-modalidade').value,
        tipo: document.getElementById('lanc-tipo').value,
        nome: nome,
        valor: document.getElementById('lanc-valor').value,
        categoria: catEscolhida,
        dia: document.getElementById('lanc-dia').value,
        parcelas: document.getElementById('lanc-parcelas').value,
        competenciaInicial: document.getElementById('filtro-mes').value || '10/2026'
      };

      try {
        await fetch(URL_DO_WEB_APP, { method: 'POST', body: JSON.stringify(payload) });
        fecharModalLancamento();
        document.getElementById('form-lancamento').reset();
        await carregarDadosDaPlanilha();
      } catch (err) {
        alert("Erro ao salvar lançamento.");
      } finally {
        btn.innerText = "Salvar Lançamento";
        btn.disabled = false;
      }
    }

    async function salvarCategoriaLimite(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-salvar-cat');
      btn.innerText = "Salvando...";
      btn.disabled = true;

      const payload = {
        acao: 'SALVAR_CATEGORIA',
        categoria: document.getElementById('cat-nome').value,
        limite: document.getElementById('cat-limite').value,
        cor: document.getElementById('cat-cor').value,
        palavrasChave: document.getElementById('cat-kws').value
      };

      try {
        await fetch(URL_DO_WEB_APP, { method: 'POST', body: JSON.stringify(payload) });
        fecharModalCategorias();
        document.getElementById('form-categoria').reset();
        await carregarDadosDaPlanilha();
      } catch (err) {
        alert("Erro ao salvar categoria.");
      } finally {
        btn.innerText = "Salvar Categoria & Limite";
        btn.disabled = false;
      }
    }

    async function forcarSyncPluggy() {
      const btn = document.getElementById('btn-sync');
      btn.innerText = "Sincronizando...";
      try {
        await fetch(URL_DO_WEB_APP, {
          method: 'POST',
          body: JSON.stringify({ acao: 'SYNC_PLUGGY' })
        });
        await carregarDadosDaPlanilha();
      } catch (e) {
        console.error(e);
      } finally {
        btn.innerText = "Atualizar";
      }
    }

    async function carregarDadosDaPlanilha() {
      try {
        const res = await fetch(URL_DO_WEB_APP, { redirect: 'follow' });
        const json = await res.json();
        if (json && json.compromissos) {
          dados = {
            contas: (json.contas && json.contas.length) ? json.contas : dados.contas,
            compromissos: json.compromissos.length ? json.compromissos : dados.compromissos,
            faturas: (json.faturas && json.faturas.length) ? json.faturas : dados.faturas,
            transacoes: json.transacoes || [],
            categoriasLimites: (json.categoriasLimites && json.categoriasLimites.length) ? json.categoriasLimites : CATEGORIAS_PADRAO,
            dinheiro: json.dinheiro || []
          };
          renderizarInterface();
        }
      } catch (e) {
        console.warn("Usando dados locais enquanto aguarda API:", e);
        renderizarInterface();
      }
    }

    // Inicializa imediatamente na abertura da página
    renderizarInterface();
    carregarDadosDaPlanilha();
  </script>
