<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Controle Financeiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold text-emerald-400">💰 Finanças Pessoais</h1>
      <span id="mes-atual" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300">Outubro/2026</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- Card Resumo / Prospecção -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow">
      <h2 class="text-xs uppercase tracking-wider text-slate-400 mb-2">Visão Geral do Mês</h2>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
          <span class="text-xs text-emerald-400 block">Total Entradas</span>
          <span id="total-entradas" class="text-lg font-bold">R$ 0,00</span>
        </div>
        <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-700/50">
          <span class="text-xs text-rose-400 block">Total Saídas</span>
          <span id="total-saidas" class="text-lg font-bold">R$ 0,00</span>
        </div>
      </div>
    </section>

    <!-- Seção de Contas Fixas e Baixas Automáticas -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-sm font-semibold text-slate-200">Compromissos do Mês</h2>
        <button onclick="abrirModal()" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-1.5 rounded-lg font-medium transition">+ Novo</button>
      </div>
      
      <div id="lista-compromissos" class="space-y-2.5">
        <div class="text-center py-4 text-slate-400 text-sm">A sincronizar com a planilha...</div>
      </div>
    </section>

  </main>

  <!-- Modal Cadastro Manual -->
  <div id="modal-cadastro" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden justify-center items-end sm:items-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-base text-slate-200">Adicionar Despesa / Receita</h3>
        <button onclick="fecharModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>
      <form id="form-novo" onsubmit="salvarCompromisso(event)" class="space-y-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Compromisso / Descrição</label>
          <input type="text" id="novo-nome" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Tipo</label>
            <select id="novo-tipo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
              <option value="SAIDA">Saída</option>
              <option value="ENTRADA">Entrada</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Valor Previsto (R$)</label>
            <input type="number" step="0.01" id="novo-valor" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
          </div>
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Dia do Vencimento</label>
          <input type="number" id="novo-dia" min="1" max="31" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition text-sm">Salvar Compromisso</button>
      </form>
    </div>
  </div>

  <script>
    // URL do Web App fixada permanentemente
    const URL_DO_WEB_APP = "https://script.google.com/macros/s/AKfycbzNdp_jDA9za0m-jg_N1-IOjzZKDnSKnm22427gleTSKJLtXKPU1_mHYsU0emJKVTn_UQ/exec";

    function abrirModal() { document.getElementById('modal-cadastro').classList.remove('hidden'); document.getElementById('modal-cadastro').classList.add('flex'); }
    function fecharModal() { document.getElementById('modal-cadastro').classList.add('hidden'); document.getElementById('modal-cadastro').classList.remove('flex'); }

    async function carregarDados() {
      try {
        const resposta = await fetch(URL_DO_WEB_APP);
        const dados = await resposta.json();
        
        let container = document.getElementById('lista-compromissos');
        container.innerHTML = '';
        
        let totalEntradas = 0;
        let totalSaidas = 0;

        dados.compromissos.forEach(item => {
          let [compromisso, tipo, valorPrevisto, dia, regra, status, valorReal] = item;
          
          let isRealizado = status.includes('PAGO') || status.includes('RECEBIDO');
          let valorExibido = (isRealizado && valorReal !== "" && !isNaN(valorReal)) ? Number(valorReal) : Number(valorPrevisto);
          
          if (tipo === 'ENTRADA') totalEntradas += valorExibido;
          if (tipo === 'SAIDA') totalSaidas += valorExibido;

          let corStatus = isRealizado ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400';
          let textoStatus = status !== "" ? status : 'PENDENTE';
          let corValor = tipo === 'ENTRADA' ? 'text-emerald-400' : 'text-rose-400';

          container.innerHTML += `
            <div class="bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 flex justify-between items-center">
              <div>
                <p class="text-sm font-medium text-white">${compromisso}</p>
                <span class="text-[11px] text-slate-400">Vencimento: Dia ${dia}</span>
              </div>
              <div class="text-right">
                <span class="block text-sm font-bold ${corValor}">R$ ${valorExibido.toFixed(2)}</span>
                <span class="text-[10px] ${corStatus} px-2 py-0.5 rounded font-medium">${textoStatus}</span>
              </div>
            </div>
          `;
        });

        document.getElementById('total-entradas').innerText = `R$ ${totalEntradas.toFixed(2)}`;
        document.getElementById('total-saidas').innerText = `R$ ${totalSaidas.toFixed(2)}`;
      } catch (e) {
        console.error("Erro ao carregar dados:", e);
        document.getElementById('lista-compromissos').innerHTML = '<div class="text-center py-4 text-rose-400 text-sm">Erro ao carregar dados da API.</div>';
      }
    }

    function salvarCompromisso(e) {
      e.preventDefault();
      alert("Compromisso cadastrado com sucesso!");
      fecharModal();
    }

    carregarDados();
  </script>
</body>
</html>
