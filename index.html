<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<title>Painel financeiro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0b0d;--card:#111317;--card2:#15181d;--tx:#e8eaed;--mut:#8b93a1;--mut2:#aab1bd;--red:#fb7185;--grn:#34d399;--teal:#2dd4bf;--amb:#fbbf24;--vio:#a78bfa;--line:rgba(255,255,255,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--tx);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:12.5px;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;color:var(--tx)}
#app{max-width:430px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top)) 14px 0;background:radial-gradient(120% 40% at 50% -8%,rgba(52,211,153,.13),rgba(10,11,13,0) 70%),var(--bg);position:relative}
.main{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;overscroll-behavior:contain}
.row{display:flex;align-items:center}
.btn0{border:0;background:none;padding:0;text-align:left}
.pill{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 6px 0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);font-size:13px;font-weight:700}
.link{min-height:44px;padding:0 10px;border:0;background:none;color:var(--grn);font-size:12px;font-weight:700}
.link:disabled{color:var(--mut)}
.hero{border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));padding:16px 16px 6px}
.lab{font-size:11px;color:var(--mut);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px;border-top:1px solid var(--line)}
.tile{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:52px;padding:9px 0 8px 0;border:0;background:none}
.tile:nth-child(even){padding-left:12px;border-left:1px solid var(--line)}
.tile:nth-child(n+3){border-top:1px solid var(--line)}
.chip{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;white-space:nowrap}
.c-red{background:rgba(251,113,133,.14);color:#fda4af}.c-green{background:rgba(52,211,153,.14);color:#6ee7b7}.c-teal{background:rgba(45,212,191,.14);color:#5eead4}.c-amber{background:rgba(251,191,36,.14);color:#fcd34d}.c-muted{background:rgba(255,255,255,.07);color:#a3abb8}.c-vio{background:rgba(167,139,250,.16);color:#c4b5fd}
.box{border-radius:20px;border:1px solid var(--line);background:var(--card);padding:14px 16px 6px}
.catrow{display:block;width:100%;min-height:40px;padding:7px 0 6px;border:0;background:none;text-align:left}
.bar{display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px}
.foot{display:flex;gap:8px;padding:8px 0 calc(10px + env(safe-area-inset-bottom))}
.b1,.b2{min-height:44px;border-radius:14px;font-size:13px;font-weight:700}
.b1{flex:1;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
.b2{flex:1.3;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.10);color:#6ee7b7}
.ov{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-end}
.ov .bk{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;background:rgba(0,0,0,.6)}
.sh{position:relative;width:100%;max-width:430px;height:calc(100dvh - 96px);display:flex;flex-direction:column;background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -16px 48px rgba(0,0,0,.55)}
.sh.alt{background:var(--card2);border-top-color:rgba(255,255,255,.12)}
.sh.alto{height:calc(100dvh - 60px)}
.sh.baixo{height:calc(100dvh - 110px)}
.shh{padding:8px 16px 0}
.grip{width:36px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto}
.shb{flex:1;overflow-y:auto;padding:8px 16px calc(28px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.close{min-height:44px;padding:0 4px 0 12px;border:0;background:none;color:var(--mut);font-size:12px;font-weight:700}
.h14{font-size:14px;font-weight:800}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{min-height:36px;padding:0 12px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.09);background:none;color:var(--mut2)}
.tab.on{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.16);color:#6ee7b7}
.tab.von{border-color:rgba(167,139,250,.45);background:rgba(167,139,250,.16);color:#c4b5fd}
.ln{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 0;border:0;border-top:1px solid rgba(255,255,255,.06);background:none;text-align:left}
.dot{width:7px;height:7px;border-radius:99px;flex:none}
.dot.o{background:none!important;border:1.5px solid}
.nm{font-size:12.5px;font-weight:600}
.sb{display:block;font-size:11px;color:var(--mut);margin-top:1px}
.vl{font-size:12.5px;font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--mut);font-weight:600}
.in{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);font-size:13px;width:100%}
.in:focus{outline:2px solid rgba(52,211,153,.5);outline-offset:1px}
select.in option{background:#15181d}
.save{min-height:46px;border-radius:14px;border:1px solid rgba(52,211,153,.35);background:rgba(52,211,153,.14);color:#6ee7b7;font-size:13px;font-weight:700;width:100%}
.save:disabled{opacity:.5}
.danger{min-height:46px;border-radius:14px;border:1px solid rgba(251,113,133,.35);background:none;color:#fda4af;font-size:12.5px;font-weight:700;width:100%}
.note{font-size:11.5px;line-height:1.45;color:var(--mut);}
.tip{font-size:11.5px;line-height:1.45;color:#a7f3d0;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.18);border-radius:12px;padding:10px 12px}
.sel{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:none;text-align:left}
.sel.on{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.10)}
.grp{border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.02)}
.sug{border-radius:14px;border:1px solid rgba(251,191,36,.3);background:rgba(251,191,36,.07);padding:10px 12px;margin:4px 0 8px}
.aviso{border-radius:12px;padding:9px 12px;font-size:11.5px;line-height:1.45}
.aviso.erro{background:rgba(251,113,133,.10);border:1px solid rgba(251,113,133,.25);color:#fda4af}
.aviso.aviso{background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.2);color:#fcd34d}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom));max-width:380px;width:calc(100% - 28px);z-index:99;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:600;background:#1c2128;border:1px solid rgba(255,255,255,.15);box-shadow:0 8px 28px rgba(0,0,0,.5)}
.toast.err{border-color:rgba(251,113,133,.5);color:#fda4af}
.toggle{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);text-align:left}
.trk{display:block;width:34px;height:20px;border-radius:99px;flex:none;position:relative;background:rgba(255,255,255,.15)}
.trk.on{background:var(--grn)}
.trk i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:99px;background:#0a0b0d}
.trk.on i{left:16px}
.skel{height:120px;border-radius:20px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.08),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.center{padding:40px 20px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlays"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
'use strict';
/* ====================================================================
   CONFIG
   ==================================================================== */
const URL_APP = 'https://script.google.com/macros/s/AKfycbzNdp_jDA9za0m-jg_N1-IOjzZKDnSKnm22427gleTSKJLtXKPU1_mHYsU0emJKVTn_UQ/exec';
const CHAVE_TOKEN = 'financas_token';
const CHAVE_CACHE = 'financas_v4_cache';
const SEM = '__SEM__';
const RED = '#fb7185', GREEN = '#34d399', TEAL = '#2dd4bf', AMBER = '#fbbf24', MUTED = '#8b93a1', VIOLET = '#a78bfa', TEXT = '#e8eaed';
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

/* ====================================================================
   UTILIDADES
   ==================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = v => 'R$ ' + Math.abs(Number(v) || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const brlS = v => (v < 0 ? '−' : '') + brl(v);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mesNome = c => c ? MESES[+c.slice(0, 2) - 1] : '';
const mesRot = c => c ? cap(mesNome(c)) + ' ' + c.slice(3) : '';
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* ignora */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignora */ } }
};
const TONS = { red: 'c-red', green: 'c-green', teal: 'c-teal', amber: 'c-amber', muted: 'c-muted', vio: 'c-vio' };
const chip = (t, tom) => t ? '<span class="chip ' + (TONS[tom] || 'c-muted') + '">' + esc(t) + '</span>' : '';

/* ====================================================================
   ESTADO
   ==================================================================== */
const S = {
  token: ls.get(CHAVE_TOKEN) || '', d: null, mes: '', carregando: false, busy: false, erro: '', sincronizando: false,
  sheet: '', fat: '', exp: '', novo: false, ntab: 'prevista', ptipo: 'saida', nv: {}, nvConta: '',
  cfg: false, cfgOpen: '', ndraft: '', rn: {},
  ed: null, edTab: 'cat', edCat: '', edFixa: '', lembrar: true,
  fix: false, fixTab: 'SAIDA', fx: null,
  picker: false, toast: null
};
const sc = {};            // posição de rolagem por área, para não "pular" a cada atualização

/* ====================================================================
   REDE
   ==================================================================== */
async function chamar(corpo, opts) {
  const resp = await fetch(URL_APP, {
    method: 'POST', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },     // evita pré-verificação CORS no Apps Script
    body: JSON.stringify(Object.assign({ token: S.token }, corpo))
  });
  if (!resp.ok) throw new Error('Falha de rede (' + resp.status + ')');
  let j; try { j = await resp.json(); } catch (e) { throw new Error('Resposta inválida do servidor'); }
  if (j.status !== 'SUCCESS') {
    const m = String(j.message || 'Erro');
    if (m === 'TOKEN_INVALIDO' || m === 'CONFIGURE_TOKEN') { const er = new Error(m); er.token = true; throw er; }
    throw new Error(m);
  }
  return j.dados;
}
function aplicar(d) {
  S.d = d; S.mes = d.mes; S.erro = '';
  const cache = (() => { try { return JSON.parse(ls.get(CHAVE_CACHE) || '{}'); } catch (e) { return {}; } })();
  cache[d.mes] = d;
  const chaves = Object.keys(cache); if (chaves.length > 4) delete cache[chaves[0]];
  ls.set(CHAVE_CACHE, JSON.stringify(cache));
}
async function carregar(mes, silencioso) {
  S.carregando = true; if (!silencioso) render();
  try { aplicar(await chamar({ acao: 'LER', mes: mes || S.mes || undefined })); }
  catch (e) { tratarErro(e); }
  S.carregando = false; render();
}
function tratarErro(e) {
  if (e.token) { S.token = ''; ls.del(CHAVE_TOKEN); S.erro = e.message === 'CONFIGURE_TOKEN' ? 'O servidor ainda não tem um token configurado (Propriedades do script → TOKEN_ACESSO).' : 'Token inválido. Digite de novo.'; }
  else if (!S.d) S.erro = 'Não consegui carregar: ' + e.message;
  else toast('Não consegui falar com o servidor: ' + e.message, true);
}
async function acao(corpo, msgOk, depois) {
  if (S.busy) return false;
  S.busy = true; render();
  try {
    const d = await chamar(Object.assign({ mes: S.mes }, corpo));
    aplicar(d); S.busy = false;
    if (depois) depois();
    if (msgOk) toast(msgOk);
    render(); return true;
  } catch (e) {
    S.busy = false;
    if (e.token) tratarErro(e); else toast(e.message, true);
    render(); return false;
  }
}
let toastT = null;
function toast(t, erro) { S.toast = { t: t, erro: !!erro }; clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; renderToast(); }, erro ? 6000 : 2600); renderToast(); }
function renderToast() { document.getElementById('toast-root').innerHTML = S.toast ? '<div class="toast' + (S.toast.erro ? ' err' : '') + '" role="status">' + esc(S.toast.t) + '</div>' : ''; }

/* ====================================================================
   ESTILO DAS LINHAS
   ==================================================================== */
const BASE = {
  'falta-pagar': { val: RED, dot: RED, cheio: 1, chip: 'Falta', t: 'red' },
  'pago': { val: MUTED, dot: '#6b7280', cheio: 0, chip: 'Pago', t: 'muted' },
  'pago-din': { val: MUTED, dot: '#6b7280', cheio: 0, chip: 'Pago · dinheiro', t: 'muted' },
  'falta-receber': { val: GREEN, dot: GREEN, cheio: 1, chip: 'Falta', t: 'green' },
  'recebido': { val: MUTED, dot: '#6b7280', cheio: 0, chip: 'Recebido', t: 'muted' },
  'despesa': { val: AMBER, dot: AMBER, cheio: 1, chip: '', t: 'amber' },
  'din-out': { val: AMBER, dot: AMBER, cheio: 1, chip: 'Dinheiro', t: 'teal' },
  'invest': { val: TEXT, dot: '#64748b', cheio: 1, chip: 'Investimento', t: 'muted' },
  'avulsa': { val: GREEN, dot: GREEN, cheio: 1, chip: '', t: 'green' },
  'din-in': { val: TEAL, dot: TEAL, cheio: 0, chip: 'Sem previsão', t: 'teal' }
};
function linhaItem(i, extrato) {
  let e = Object.assign({ val: TEXT, dot: VIOLET, cheio: 1, chip: '', t: 'muted' }, BASE[i.g] || {});
  const sinal = i.s || (i.g === 'falta-receber' || i.g === 'recebido' || i.g === 'avulsa' || i.g === 'din-in' ? '+' : '−');
  if (!extrato && i.sp && i.g !== 'din-in') e = { val: TEAL, dot: TEAL, cheio: 0, chip: 'Sem previsão', t: 'teal' };
  if (i.est) e = { val: GREEN, dot: GREEN, cheio: 1, chip: 'Estorno', t: 'green' };
  let corNome = (e.cheio || extrato) ? TEXT : MUTED;
  if (extrato) {
    e.val = sinal === '+' ? GREEN : RED; e.dot = e.val; e.cheio = 1;
    if (i.g === 'recebido' || i.g === 'pago') { e.chip = 'Conta fixa'; e.t = 'muted'; }
    else if (i.g === 'despesa' && !i.est) { e.chip = 'Despesa'; e.t = 'amber'; }
    else if (i.sp) { e.chip = 'Sem previsão'; e.t = 'teal'; }
  }
  let acao = '', extra = '';
  if (i.id && i.origem && !i.est && sinal === '−') { acao = 'editar-item'; extra = '<span style="display:block;font-size:11px;color:#a5b4fc;margin-top:2px">' + esc(catNome(i.cat)) + ' · alterar</span>'; }
  else if (i.baixaId) { acao = 'ver-baixa'; extra = '<span style="display:block;font-size:11px;color:#a5b4fc;margin-top:2px">Ver ou desfazer a baixa</span>'; }
  else if (i.g === 'falta-pagar' && i.contaId) { acao = 'baixa-conta'; extra = '<span style="display:block;font-size:11px;color:#a5b4fc;margin-top:2px">Dar baixa com dinheiro</span>'; }
  const dot = '<span class="dot' + (e.cheio ? '' : ' o') + '" style="' + (e.cheio ? 'background:' : 'border-color:') + e.dot + '" aria-hidden="true"></span>';
  const corpo = dot + '<span style="min-width:0;flex:1;display:block"><span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span class="nm" style="color:' + corNome + '">' + esc(i.nome) + '</span>' + chip(e.chip, e.t) + '</span>'
    + (i.sub ? '<span class="sb">' + esc(i.sub) + '</span>' : '') + extra + '</span>'
    + '<span style="text-align:right;flex:none;display:block"><span class="vl" style="color:' + e.val + '">' + esc(sinal + brl(i.valor)) + '</span><span class="sb">' + esc(i.data || '') + '</span></span>';
  if (acao) return '<button type="button" class="ln" data-a="' + acao + '" data-v="' + esc(i.id || i.baixaId || i.contaId) + '" data-k="' + esc(i.nome) + '">' + corpo + '</button>';
  return '<div class="ln" style="min-height:0">' + corpo + '</div>';
}
function catNome(c) { return !c || c === SEM ? 'Sem categoria' : c; }

/* ====================================================================
   SEÇÕES (cada bloco da tela principal abre uma folha)
   ==================================================================== */
function secoes(d) {
  const n = d.numeros, mes = mesNome(d.mes), car = d.cartao || { abas: [], proximas: [], conferencia: [], limite: null, nome: 'Nubank' };
  const por = (gs, f) => d.itens.filter(i => (f ? f(i) : gs.indexOf(i.g) >= 0)).sort((a, b) => (a.dia || 0) - (b.dia || 0));
  const out = {};
  const rotSaldo = d.modo === 'passado' ? 'saldo no fim do mês' : d.modo === 'futuro' ? 'saldo projetado' : 'saldo na conta';
  out.saldo = { rotulo: car.nome + ' · ' + rotSaldo, valor: brl(n.saldo), cor: VIOLET, sub: 'Conta corrente ' + car.nome, extrato: true, resumo: d.saldoResumo,
    itens: por(['recebido', 'pago', 'avulsa', 'despesa', 'invest']), legenda: 'Só o que passou pela conta · verde entrou, vermelho saiu' };
  const pctR = n.previstoReceber > 0 ? Math.max(0, Math.min(100, Math.round((n.previstoReceber - n.faltaReceber) / n.previstoReceber * 100))) : 0;
  out.receber = { rotulo: 'Falta receber', valor: brl(n.faltaReceber), cor: GREEN, pct: pctR, barCor: GREEN, sub: 'Previsto no mês ' + brl(n.previstoReceber),
    sub2: n.semPrevisao > 0 ? 'Já inclui ' + brl(n.semPrevisao) + ' que entrou sem previsão' : '',
    itens: por(null, i => i.g === 'falta-receber' || i.g === 'recebido' || (i.sp && i.g !== 'recebido')), legenda: 'Ponto cheio: ainda falta · vazio: já entrou · verde-água: sem previsão' };
  const pctP = n.previstoPagar > 0 ? Math.max(0, Math.min(100, Math.round(n.pagoPrevisto / n.previstoPagar * 100))) : 0;
  out.pagar = { rotulo: 'Falta pagar', valor: brl(n.faltaPagar), cor: RED, pct: pctP, barCor: RED, sub: 'Previsto no mês ' + brl(n.previstoPagar), sug: true,
    itens: por(['falta-pagar', 'pago', 'pago-din']), legenda: 'Ponto cheio: ainda falta pagar · vazio: já pago · toque numa conta para dar baixa com dinheiro' };
  out.despesas = { rotulo: 'Despesas do mês', valor: brl(n.despesas), cor: AMBER, sub: 'Já saiu da conta · fora as contas fixas', sug: true,
    itens: por(['despesa', 'din-out']), legenda: 'Saídas que não são contas fixas · toque para mudar a categoria ou ligar a uma conta fixa' };
  out.dinheiro = { rotulo: 'Dinheiro em mãos', valor: brl(n.carteira), cor: TEAL, sub: 'Entrou ' + brl(n.dinEntrou) + ' · usado ' + brl(n.dinUsado), sub2: 'Não passa pela conta do banco · entra como não previsto',
    itens: por(['din-in', 'pago-din', 'din-out']), legenda: 'Toda entrada em dinheiro é não prevista · a baixa usa esse dinheiro em contas previstas' };
  // cartão
  const aba = car.abas.filter(a => a.comp === S.fat)[0] || car.abas.filter(a => a.comp === d.mes)[0] || car.abas[0];
  const stTxt = { paga: 'Paga', aberta: 'Aberta', fechada: 'Fechada', projecao: 'Prevista' }, stTom = { paga: 'green', aberta: 'amber', fechada: 'amber', projecao: 'muted' };
  const lim = car.limite;
  out.cartao = { rotulo: 'Cartão ' + car.nome, valor: aba ? brl(aba.total) : '—', cor: VIOLET, cartao: true, aba: aba, abas: car.abas, stTxt: stTxt, stTom: stTom,
    pct: lim && lim.total ? Math.round(lim.usado / lim.total * 100) : 0, barCor: VIOLET,
    sub: aba ? 'Fatura de ' + mesNome(aba.comp) + ' · vencimento ' + aba.venc + (/\d/.test(aba.paga || '') ? ' · paga em ' + aba.paga : '') : 'Sem fatura neste mês',
    sub3: lim ? 'Limite usado ' + brl(lim.usado) + ' de ' + brl(lim.total) + ' · disponível ' + brl(lim.disponivel) : '', itens: [], legenda: 'Só o que passou no cartão ' + car.nome + ' · toque numa compra para mudar a categoria' };
  // categorias
  const cats = d.categorias.lista.filter(c => c.itens.length).slice().sort((a, b) => b.total - a.total);
  cats.forEach((c, ix) => {
    out['cat' + ix] = { rotulo: c.nome, valor: brl(c.total), cor: c.cor, cat: c, sub: 'Gasto realizado em ' + mes + ' · conta, cartão e dinheiro',
      sub2: c.itens.reduce((t, i) => t + i.n, 0) + ' lançamentos agrupados por estabelecimento', legenda: 'Toque em um grupo para ver os lançamentos e mudar um por um · estornos já descontados' };
  });
  const sem = d.categorias.sem;
  if (sem && sem.itens && sem.itens.length) out.semcat = { rotulo: 'Sem categoria', valor: brl(sem.total), cor: MUTED, cat: { nome: SEM, itens: sem.itens }, semFlag: true,
    sub: 'Fora do total de gastos por categoria', sub2: sem.itens.length + (sem.itens.length === 1 ? ' estabelecimento' : ' estabelecimentos') + ' sem categoria · toque para escolher uma', legenda: 'Estes gastos não somam no gráfico, mas continuam no saldo e em Despesas do mês' };
  out._cats = cats;
  return out;
}

function folha(z, cls, rotulo, conteudo, fechar) {

function folhaDetalhe() {

    + '<div class="sb" style="margin-top:8px">' + esc(s.sub) + '</div>' + (s.sub2 ? '<div class="sb">' + esc(s.sub2) + '</div>' : '') + (s.sub3 ? '<div class="sb">' + esc(s.sub3) + '</div>' : '')

    if (s.aba) {

      corpo += '<div class="aviso ' + (pago ? '' : 'aviso') + '" style="margin-bottom:4px;' + (pago ? 'background:rgba(167,139,250,.10);border:1px solid rgba(167,139,250,.2);color:#c4b5fd' : '') + '">' + esc(msg) + '</div>';
    }
  }
  if (s.resumo) corpo += '<div style="background:rgba(255,255,255,.04);border-radius:12px;padding:2px 12px;margin-bottom:4px">' + s.resumo.map(q => '<div class="row" style="justify-content:space-between;gap:10px;padding:6px 0"><span style="font-size:11.5px;color:var(--mut)">' + esc(q.nome) + '</span><span style="font-size:11.5px;font-weight:700;white-space:nowrap;color:' + (q.tom === 'verde' ? GREEN : q.tom === 'vermelho' ? RED : TEXT) + '">' + esc((q.tom === 'verde' ? '+' : '') + brlS(q.valor)) + '</span></div>').join('') + '</div>';

      + '<div style="font-size:11.5px;font-weight:700;color:#aab1bd;padding:10px 0 2px;border-top:1px solid var(--line)">Conferência</div>'

function linhaCartao(i) {
  const est = i.est || i.valor < 0;

  const corpo = '<span class="dot" style="background:' + (est ? GREEN : VIOLET) + '" aria-hidden="true"></span><span style="min-width:0;flex:1;display:block"><span style="display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span class="nm">' + esc(i.nome) + '</span>' + (est ? chip('Estorno', 'green') : '') + '</span><span class="sb">' + esc(i.sub || '') + '</span><span style="display:block;font-size:11px;color:#a5b4fc;margin-top:2px">' + esc(catNome(i.cat)) + ' · alterar</span></span>'
    + '<span style="text-align:right;flex:none;display:block"><span class="vl" style="color:' + cor + '">' + esc((est ? '+' : '') + brl(i.valor)) + '</span><span class="sb">' + esc(i.data || '') + '</span></span>';

}
function linhasCategoria(s) {
  const c = s.cat; let h = '';
  c.itens.forEach(i => {
    const gk = (s.semFlag ? SEM : c.nome) + '|' + i.nome, grupo = i.tx && i.tx.length > 1, aberto = S.exp === gk;
    const marc = s.semFlag ? 'border-color:#6b7280' : 'background:' + s.cor;
    const ed = i.tx && i.tx.length > 0;
    const catTxt = !ed ? '' : grupo ? (aberto ? 'Recolher os lançamentos' : 'Ver os ' + i.n + ' lançamentos · mudar um por um') : catNome(s.semFlag ? SEM : c.nome) + ' · alterar';
    const corpo = '<span class="dot' + (s.semFlag ? ' o' : '') + '" style="' + marc + '" aria-hidden="true"></span><span style="min-width:0;flex:1;display:block"><span class="nm" style="display:block">' + esc(i.nome) + '</span><span class="sb">' + esc((i.origem ? i.origem + ' · ' : '') + i.n + (i.n === 1 ? ' lançamento' : ' lançamentos')) + '</span>' + (catTxt ? '<span style="display:block;font-size:11px;color:#a5b4fc;margin-top:2px">' + esc(catTxt) + '</span>' : '') + '</span>'
      + '<span style="text-align:right;flex:none;display:block"><span class="vl">' + esc(brlS(i.valor)) + '</span><span class="sb">' + esc(i.data || '') + '</span></span>';
    if (!ed) h += '<div class="ln" style="min-height:0">' + corpo + '</div>';
    else if (grupo) h += '<button type="button" class="ln" data-a="exp" data-v="' + esc(gk) + '">' + corpo + '</button>';
    else h += botaoTx(i, i.tx[0], corpo, s.semFlag ? SEM : c.nome);
    if (grupo && aberto) i.tx.forEach(t => {
      const neg = t.valor < 0;
      h += botaoTx(i, t, '<span class="dot" style="background:#475569;margin-left:12px" aria-hidden="true"></span><span style="flex:1;display:block"><span class="nm" style="display:block;font-size:12px">' + esc(t.data + ' · ' + t.origem) + '</span><span style="display:block;font-size:11px;color:#a5b4fc">Mudar só este</span></span><span class="vl" style="color:' + (neg ? GREEN : TEXT) + '">' + esc(brlS(t.valor)) + '</span>', s.semFlag ? SEM : c.nome);
    });
  });
  return h;
}
function botaoTx(i, t, corpo, cat) {
  return '<button type="button" class="ln" data-a="editar-cat-tx" data-id="' + esc(t.id) + '" data-or="' + esc(t.orig || 'TRANSACAO') + '" data-nome="' + esc(i.nome) + '" data-data="' + esc(t.data) + '" data-valor="' + esc(t.valor) + '" data-cat="' + esc(cat) + '" data-conta="' + (t.origem === 'Conta' ? 1 : 0) + '">' + corpo + '</button>';

/* ====================================================================
   RENDER (preserva foco de inputs e rolagem)
   ==================================================================== */
function render() {
  const raiz = document.getElementById('app'), ov = document.getElementById('overlays');
  document.querySelectorAll('[data-sc]').forEach(el => { sc[el.dataset.sc] = el.scrollTop; });
  const ativo = document.activeElement, foco = ativo && ativo.dataset && ativo.dataset.in ? { in: ativo.dataset.in, k: ativo.dataset.k || '', ini: ativo.selectionStart, fim: ativo.selectionEnd } : null;
  if (!S.token) { raiz.innerHTML = telaToken(); ov.innerHTML = ''; return; }
  raiz.innerHTML = telaPrincipal();
  let h = '';
  if (S.d) {
    if (S.sheet) h += folhaDetalhe();
    if (S.novo) h += folhaNovo();
    if (S.cfg) h += folhaCfg();
    if (S.fix) h += folhaFix();
    if (S.fx) h += folhaFixEd();
    if (S.picker) h += folhaMes();
    if (S.ed) h += folhaEd();
  }
  ov.innerHTML = h;
  document.querySelectorAll('[data-sc]').forEach(el => { if (sc[el.dataset.sc]) el.scrollTop = sc[el.dataset.sc]; });
  if (foco) {
    const el = Array.prototype.filter.call(document.querySelectorAll('[data-in="' + foco.in + '"]'), x => (x.dataset.k || '') === foco.k)[0];
    if (el) { el.focus(); try { el.setSelectionRange(foco.ini, foco.fim); } catch (e) { /* select/password */ } }
  }
}

   ==================================================================== */
function fechaTopo() {
  if (S.ed) S.ed = null; else if (S.picker) S.picker = false; else if (S.fx) S.fx = null;
  else if (S.novo) S.novo = false; else if (S.cfg) S.cfg = false; else if (S.fix) S.fix = false; else if (S.sheet) S.sheet = ''; else return false;
  render(); return true;
}
function abrirEd(o) {
  S.ed = o; S.edTab = 'cat'; S.edCat = o.catAtual || SEM; S.edFixa = ''; S.lembrar = true; render();
}
const A = {
  entrar() { const v = (S.nvTok || '').trim(); if (!v) return; S.token = v; ls.set(CHAVE_TOKEN, v); S.erro = ''; carregar(); },
  recarregar() { S.erro = ''; carregar(); },
  abrir(e) { S.sheet = e.v; S.exp = ''; sc.det = 0; if (e.v === 'cartao') S.fat = ''; render(); },
  'fechar-sheet'() { S.sheet = ''; render(); },
  fat(e) { S.fat = e.v; render(); },
  exp(e) { S.exp = S.exp === e.v ? '' : e.v; render(); },
  picker() { S.picker = true; render(); },
  'fechar-picker'() { S.picker = false; render(); },
  mes(e) { S.picker = false; S.sheet = ''; S.mes = e.v; carregar(e.v); },
  async sync() {
    if (S.sincronizando) return;
    S.sincronizando = true; render();
    try { aplicar(await chamar({ acao: 'SYNC_PLUGGY', mes: S.mes })); toast('Dados do banco atualizados'); }
    catch (er) { if (er.token) tratarErro(er); else toast('Não consegui atualizar: ' + er.message, true); }
    S.sincronizando = false; render();
  },
  /* itens e categorias */
  'editar-item'(e) {
    const i = S.d.itens.filter(x => x.id === e.v)[0]; if (!i) return;
    abrirEd({ kind: 'cat', id: i.id, origem: i.origem, nome: i.nome, data: i.data, valor: i.valor, catAtual: i.cat || SEM, conta: i.origem === 'TRANSACAO' });
  },
  'editar-cat-tx'(e) {
    abrirEd({ kind: 'cat', id: e.id, origem: e.or, nome: e.nome, data: e.data, valor: Number(e.valor), catAtual: e.cat || SEM, conta: e.conta === '1' });
  },
  'ver-baixa'(e) {
    const i = S.d.itens.filter(x => x.baixaId === e.v)[0]; if (!i) return;
    S.ed = { kind: 'baixa', baixaId: i.baixaId, nome: i.nome, valor: i.valor, sub: i.sub }; render();
  },
  desfazer(e) { acao({ acao: 'DESFAZER_BAIXA', id: e.v }, 'Baixa desfeita', () => { S.ed = null; }); },
  'baixa-conta'(e) { S.novo = true; S.ntab = 'baixa'; S.nvConta = e.v; const i = S.d.itens.filter(x => x.contaId === e.v && x.g === 'falta-pagar')[0]; S.nv = { valor: i ? String(i.valor).replace('.', ',') : '' }; render(); },
  'fechar-ed'() { S.ed = null; render(); },
  'ed-tab'(e) { S.edTab = e.v; render(); },
  'ed-cat'(e) { S.edCat = e.v; render(); },
  'ed-fixa'(e) { S.edFixa = e.v; render(); },
  lembrar() { S.lembrar = !S.lembrar; render(); },
  'salvar-ed'() {
    const x = S.ed; if (!x || x.kind !== 'cat') return;
    if (S.edTab === 'fixa' && x.conta) {
      if (!S.edFixa) return;
      acao({ acao: 'CONFIRMAR_BAIXA', txId: x.id, contaId: S.edFixa, comp: S.mes, lembrar: S.lembrar }, 'Baixa registrada', () => { S.ed = null; });
    } else acao({ acao: 'CLASSIFICAR', id: x.id, origem: x.origem, categoria: S.edCat, lembrar: S.lembrar }, 'Categoria salva', () => { S.ed = null; });
  },
  'sug-ok'(e) { const g = S.d.sugestoes[+e.v]; if (g) acao({ acao: 'CONFIRMAR_BAIXA', txId: g.txId, contaId: g.contaId, comp: g.comp, lembrar: false }, 'Baixa registrada'); },
  'sug-nao'(e) { const g = S.d.sugestoes[+e.v]; if (g) acao({ acao: 'IGNORAR_SUGESTAO', txId: g.txId }, 'Ok, não é conta fixa'); },
  /* categorias */
  'abrir-cfg'() { S.cfg = true; S.sheet = ''; S.novo = false; render(); },
  'fechar-cfg'() { S.cfg = false; render(); },
  'cfg-abrir'(e) { S.cfgOpen = S.cfgOpen === e.v ? '' : e.v; render(); },
  'criar-cat'() {
    const v = S.ndraft.trim(); if (!v) return;
    acao({ acao: 'CRIAR_CATEGORIA', nome: v }, 'Categoria criada', () => { S.ndraft = ''; S.cfgOpen = v; });
  },
  renomear(e) {
    const para = (S.rn[e.v] !== undefined ? S.rn[e.v] : e.v).trim(); if (!para || para === e.v) return;
    acao({ acao: 'RENOMEAR_CATEGORIA', de: e.v, para: para }, 'Categoria renomeada', () => { delete S.rn[e.v]; S.cfgOpen = para; });
  },
  'rm-regra'(e) { acao({ acao: 'REMOVER_REGRA', padrao: e.v }, 'Não vou mais reconhecer esse estabelecimento'); },
  /* contas fixas */
  'abrir-fix'() { S.fix = true; S.sheet = ''; S.novo = false; S.cfg = false; render(); },
  'fechar-fix'() { S.fix = false; S.fx = null; render(); },
  'fix-tab'(e) { S.fixTab = e.v; render(); },
  'fix-nova'() { S.fx = { id: '', tipo: S.fixTab, nome: '', valor: '', dia: '', rep: 'mensal', pa: '1', pt: '', cat: 'Diversos', palavras: [], novaPal: '', desde: 'este', conf: false }; render(); },
  'fix-abrir'(e) {
    const f = S.d.fixas.filter(x => x.id === e.v)[0]; if (!f) return;
    S.fx = { id: f.id, tipo: f.tipo, nome: f.nome, valor: String(f.valor).replace('.', ','), dia: String(f.dia), rep: f.parcela ? 'parc' : 'mensal', pa: f.parcela ? String(f.parcela.n) : '1', pt: f.parcela ? String(f.parcela.total) : '', cat: f.categoria, palavras: f.palavras.slice(), novaPal: '', desde: 'este', conf: false }; render();
  },
  'fechar-fixed'() { S.fx = null; render(); },
  'fx-set'(e) { S.fx[e.k] = e.v; S.fx.conf = false; render(); },
  'fx-rm-pal'(e) { S.fx.palavras.splice(+e.v, 1); render(); },
  'fx-add-pal'() { const v = S.fx.novaPal.trim(); if (!v) return; if (S.fx.palavras.indexOf(v) < 0) S.fx.palavras.push(v); S.fx.novaPal = ''; render(); },
  'fx-salvar'() {
    const x = S.fx; if (!x.nome.trim()) return toast('Informe o nome da conta', true);
    if (x.novaPal.trim() && x.palavras.indexOf(x.novaPal.trim()) < 0) x.palavras.push(x.novaPal.trim());
    const parc = x.rep === 'parc';
    acao({ acao: 'SALVAR_FIXA', id: x.id || undefined, tipo: x.tipo, nome: x.nome, valor: x.valor, dia: x.dia, categoria: x.cat, palavras: x.palavras, repeticao: parc ? 'parcelado' : 'mensal', parcelaAtual: x.pa, parcelaTotal: x.pt, desde: x.desde, primeira: x.id ? undefined : S.mes }, 'Conta fixa salva', () => { S.fx = null; });
  },
  'fx-encerrar'() {
    const x = S.fx; if (!x.conf) { x.conf = true; render(); return; }
    acao({ acao: 'ENCERRAR_FIXA', id: x.id }, 'Conta encerrada', () => { S.fx = null; });
  },
  /* novo lançamento */
  'abrir-novo'() { S.novo = true; S.sheet = ''; S.cfg = false; S.nv = {}; S.nvConta = ''; render(); },
  'fechar-novo'() { S.novo = false; render(); },
  ntab(e) { S.ntab = e.v; S.nv = {}; S.nvConta = ''; render(); },
  ptipo(e) { S.ptipo = e.v; render(); },
  'nv-conta'(e) { S.nvConta = e.v; S.nv.valor = String(e.valor).replace('.', ','); render(); },
  'nv-salvar'() {
    const n = S.nv, t = S.ntab, valor = (n.valor || '').trim();
    if (!valor) return toast('Informe o valor', true);
    const fim = () => { S.novo = false; S.nv = {}; S.nvConta = ''; };
    if (t === 'baixa') { if (!S.nvConta) return toast('Escolha a conta', true); return acao({ acao: 'BAIXA_DINHEIRO', contaId: S.nvConta, comp: S.mes, valor: valor }, 'Baixa registrada', fim); }
    if (t === 'hora') return acao({ acao: 'LANCAR_DINHEIRO', tipo: 'SAIDA', valor: valor, descricao: n.desc || '', categoria: n.cat || 'Diversos' }, 'Gasto registrado', fim);
    if (t === 'entrada') return acao({ acao: 'LANCAR_DINHEIRO', tipo: 'ENTRADA', valor: valor, descricao: n.desc || '' }, 'Entrada registrada', fim);
    if (!(n.desc || '').trim()) return toast('Informe a descrição', true);
    if (!(n.dia || '').trim()) return toast('Informe o dia do vencimento', true);
    const parc = (n.parc || '').trim();
    return acao({ acao: 'SALVAR_FIXA', tipo: S.ptipo === 'saida' ? 'SAIDA' : 'ENTRADA', nome: n.desc, valor: valor, dia: n.dia, categoria: n.cat || 'Diversos', palavras: [n.desc], repeticao: parc ? 'parcelado' : 'mensal', parcelaAtual: 1, parcelaTotal: parc, primeira: n.prim || S.mes }, 'Lançamento previsto salvo', fim);
  }
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el || el.disabled) return;
  const f = A[el.dataset.a]; if (!f) return;
  f(el.dataset);
});
document.addEventListener('input', ev => {                   // digitar nunca redesenha a tela: o foco não se perde
  const t = ev.target, k = t.dataset && t.dataset.in; if (!k) return;
  if (k === 'nv') S.nv[t.dataset.k] = t.value;
  else if (k === 'ndraft') S.ndraft = t.value;
  else if (k === 'rn') S.rn[t.dataset.k] = t.value;
  else if (k === 'fx') S.fx[t.dataset.k] = t.value;
  else if (k === 'tok') S.nvTok = t.value;
});
document.addEventListener('change', ev => {
  const t = ev.target, k = t.dataset && t.dataset.in;
  if (k === 'nvsel') S.nv[t.dataset.k] = t.value;
  else if (k === 'fxsel') S.fx[t.dataset.k] = t.value;
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') fechaTopo();
  else if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.in === 'tok') A.entrar();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.token && S.d && !S.busy && !S.ed && !S.fx && !S.novo) carregar(S.mes, true); });

/* ====================================================================
   INÍCIO: mostra o último dado salvo na hora e atualiza em seguida
   ==================================================================== */
(function iniciar() {
  try { const c = JSON.parse(ls.get(CHAVE_CACHE) || '{}'), ks = Object.keys(c); if (ks.length && S.token) { S.d = c[ks[ks.length - 1]]; S.mes = ''; } } catch (e) { /* cache ruim: ignora */ }
  render();
  if (S.token) carregar(undefined, true);
})();
</script>
</body>
</html>
